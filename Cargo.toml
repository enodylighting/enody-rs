[package]
name = "enody"
description = "SDK for Enody Lighting devices"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/enodylighting/enody-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["remote", "cli"]
std = ["postcard/use-std", "serde/std", "snow?/std"]
remote = ["std", "edge-mdns", "env_logger", "tokio", "socket2", "rusb", "serialport", "espflash", "reqwest", "snow", "sha2", "windows-sys"]
cli = ["clap", "dialoguer", "serde_json"]

[[bin]]
name = "enody"
path = "src/main.rs"
required-features = ["remote", "cli"]

[package.metadata.docs.rs]
features = ["remote", "cli"]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = { version = "0.1.89" }
log         = { version = "0.4.27" }
rusb        = { version = "0.9.4", features = ["serde"], optional = true }
serde       = { version = "1.0.219", default-features = false, features = ["derive", "alloc"] }
heapless    = { version = "0.9.2", features = ["serde"] }
uuid        = { version = "1.16.0", default-features = false, features = ["v1", "v4", "v6", "serde"] }
postcard    = { version = "1.1.1", default-features = false, features = ["heapless"] }

# Dependencies that require std
clap        = { version = "4.5", optional = true, features = ["derive"] }
dialoguer   = { version = "0.12.0", optional = true }
serde_json  = { version = "1.0", optional = true }
env_logger  = { version = "0.11.8", optional = true }
edge-mdns   = { version = "0.7.0", default-features = false, optional = true }
tokio       = { version = "1.44.2", features = ["full"], optional = true }
socket2     = { version = "0.6.2", optional = true }
serialport  = { version = "4.6.0", optional = true }
espflash    = { version = "4.4.0", optional = true }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
snow        = { version = "0.10", default-features = false, features = ["default-resolver-crypto"], optional = true }
sha2        = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
